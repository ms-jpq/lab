# https://github.com/danny-avila/LibreChat/blob/main/librechat.example.yaml
---
version: 1.3.9

mcpSettings:
  allowedDomains:
    - "*.m5_assert([ENV_DOMAIN])"
    - "*.svc.cluster.local"

mcpServers:
  crawl4ai:
    type: http
    url: http://crawl4ai.komposed-mcp.svc.cluster.local:8000/mcp
  kubernetes:
    type: http
    url: http://mcp.komposed-k8s-mcp.svc.cluster.local:8080/mcp
  playwright:
    type: http
    url: http://playwright.komposed-mcp.svc.cluster.local:8080/mcp
  searx:
    type: http
    url: http://mcp.komposed-searx.svc.cluster.local:8080/mcp
  time:
    type: http
    url: http://time.komposed-mcp.svc.cluster.local:8000/mcp
  youtube:
    type: http
    url: http://youtube-transcript.komposed-mcp.svc.cluster.local:8000/mcp

memory:
  disabled: true

interface:
  modelSelect: true
  parameters: true
  presets: true

modelSpecs:
  list:
    - name: deepseek-v4-pro
      label: DeepSeek V4 Pro
      default: true
      mcpServers:
        - searx
        - crawl4ai
      preset:
        endpoint: deepseek
        model: deepseek-v4-pro

endpoints:
  custom:
    - name: "llama.cpp"
      apiKey: "${LLAMA_API_KEY}"
      baseURL: "m5_assert([ENV_LLAMA_API_BASE])"
      modelDisplayLabel: "llama.cpp"
      titleModel: "unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL"
      models:
        default:
          - "unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL"
        fetch: true

    - name: "deepseek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com"
      modelDisplayLabel: "DeepSeek"
      titleModel: "deepseek-v4-flash"
      models:
        default:
          - "deepseek-v4-pro"
          - "deepseek-v4-flash"
        fetch: true
