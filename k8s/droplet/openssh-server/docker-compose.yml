---
x-networkpolicy:
  - servarr

x-k8s:
  # openssh-server-fwd.komposed-openssh-server.svc.cluster.local
  - apiVersion: v1
    kind: Service
    metadata:
      name: openssh-server-fwd
      namespace: ${COMPOSE_PROJECT_NAME}
    spec:
      ipFamilyPolicy: PreferDualStack
      ipFamilies:
        - IPv6
        - IPv4
      selector:
        io.kompose.service: &service openssh-server
      ports:
        - name: proxy
          port: 8080
          targetPort: 8080

  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: openssh-server-ingress
      namespace: ${COMPOSE_PROJECT_NAME}
    spec:
      podSelector:
        matchLabels:
          io.kompose.service: *service
      policyTypes:
        - Ingress
      ingress:
        - ports:
            - port: 2222
              protocol: TCP
        - from:
            - podSelector: {}
          ports:
            - port: 8080
              protocol: TCP

services:
  openssh-server:
    image: lscr.io/linuxserver/openssh-server:latest
    labels:
      kompose.service.nodeport.port: 30022
      kompose.service.type: nodeport
    environment:
      PUBLIC_KEY_DIR: /srv
    ports:
      - 2222
    volumes:
      - ./authorized_keys:/srv/authorized_keys:ro
      - ./sshd_config:/config/sshd/sshd_config.d/forward.conf:ro
