<span>
  <output id="current-time"></output>
</span>
<input
  id="scrubber"
  aria-label="Seek"
  type="range"
  min="0"
  max="${duration}"
  step="0.001"
  data-transformed="${transformed}"
  value="${time}"
/>
<output id="remaining-time"></output>
<output id="buffered-time"></output>
<output id="loading-speed" aria-label="Buffer fill rate"></output>
<button id="fullscreen" type="button" aria-label="Toggle fullscreen">⛶</button>
